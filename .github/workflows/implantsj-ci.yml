name: implantsj-ci

on:
  push:
    paths:
      - "implantsj/**"
      - ".github/workflows/implantsj-ci.yml"
  pull_request:
    paths:
      - "implantsj/**"
      - ".github/workflows/implantsj-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implantsj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implantsj/requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q src pipelines tools tests
      - name: Run tests
        run: python -m pytest -q

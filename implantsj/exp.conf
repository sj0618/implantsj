# =====================================================================
# implantsj 실험 설정 파일 (처음에 한 번만 편집하면 됨)
# ---------------------------------------------------------------------
# 폐쇄망에서는 복사/붙여넣기가 안 되므로, 긴 경로/옵션을 매번 타이핑하지
# 않도록 여기에 한 번만 적어둔다. run.sh 가 이 값을 읽어서 사용한다.
# 환경변수로도 덮어쓸 수 있다. 예) DEVICE=cpu ./run.sh
# =====================================================================

# --- 경로 (폐쇄망 기본값) --------------------------------------------
# 실제 데이터가 mount 되는 위치. 데이터셋들은 이 밑에 폴더로 존재한다.
#   예) $DATA_ROOT/7label/{train,valid,test}/<class>/*.jpg
DATA_ROOT="${DATA_ROOT:-/workspace/data}"
# 학습 결과(checkpoint/로그/리포트)가 쌓이는 위치.
OUTPUT_ROOT="${OUTPUT_ROOT:-/workspace/outputs}"

# --- VLM feature (ViT 패치 주입 실험용) ------------------------------
# 13feature/21reason jsonl. 메뉴의 "ViT + feature 패치" 항목이 이 파일을 쓴다.
# 마운트된 데이터에 있으면 그것을 쓰고, 없으면 이미지에 구워둔 사본으로 넘어간다.
# 폐쇄망은 망 경계를 넘는 파일 반입이 번거로워 사본을 이미지에 넣어뒀다.
# 사본은 AI Hub 27클래스 241건이다. 현재 7/11-label manifest 와는 파일명이
# 달라 커버리지가 0 일 수 있다 — docs/vlm/MULTIMODAL_STATUS.md 참고.
_VLM_DEFAULT="$DATA_ROOT/aihub_all_13feature_21reason_vlm.jsonl"
[[ -f "$_VLM_DEFAULT" ]] || _VLM_DEFAULT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)/configs/vlm/aihub_all_13feature_21reason_vlm.jsonl"
VLM_FEATURES="${VLM_FEATURES:-$_VLM_DEFAULT}"

# --- 클래스 -> 13 feature 정답표 (VLM 아님) --------------------------
# 메뉴 15/16 (attribute 학습·unseen 표 채우기) 이 이 파일을 정답으로 쓴다.
FEATURE_TABLE="${FEATURE_TABLE:-$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)/configs/class_features.csv}"

# --- 얼굴인식(ArcFace) ----------------------------------------------
# 갤러리 centroid 와의 코사인 유사도가 이 값 미만이면 "모름"(unknown) 으로
# 판정한다(open-set). 낮추면 unknown 이 줄고 오인식이 늘어난다.
ARCFACE_THRESHOLD="${ARCFACE_THRESHOLD:-0.30}"
# 임베딩 차원. 갤러리(.npz)와 체크포인트가 이 값을 공유한다.
ARCFACE_DIM="${ARCFACE_DIM:-128}"

# --- ArcFace + 13 feature (메뉴 18) ---------------------------------
# attribute loss 가중치. 0 이면 순수 ArcFace 와 같아진다.
ARCFACE_ATTR_WEIGHT="${ARCFACE_ATTR_WEIGHT:-1.0}"
# train 에서 희귀 클래스 N 개를 빼 unseen 으로 만든다. 0 이면 데이터셋의
# split 을 그대로 믿는다. unseen 이 0 개면 head 분기가 안 돌아 측정이 안 된다.
ARCFACE_HOLDOUT="${ARCFACE_HOLDOUT:-0}"

# --- 장치 -----------------------------------------------------------
# cuda | cpu | mps | auto  (폐쇄망 서버는 cuda)
DEVICE="${DEVICE:-cuda}"

# --- 학습 기본 하이퍼파라미터 ----------------------------------------
EPOCHS="${EPOCHS:-80}"
BATCH_SIZE="${BATCH_SIZE:-32}"
IMAGE_SIZE="${IMAGE_SIZE:-224}"
LR="${LR:-5e-5}"
SEED="${SEED:-42}"
NUM_WORKERS="${NUM_WORKERS:-8}"

# --- 모델 후보 목록 -------------------------------------------------
# configs/backbones.txt 를 읽어 MODELS 배열로 만든다(메뉴에서 번호로 고름).
# 목록을 바꾸려면 configs/backbones.txt 만 편집하면 된다.
_BACKBONE_FILE="${_BACKBONE_FILE:-$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)/configs/backbones.txt}"
MODELS=()
if [[ -f "$_BACKBONE_FILE" ]]; then
  while IFS= read -r _line; do
    _line="${_line%%#*}"                # 주석 제거
    _line="$(printf '%s' "$_line" | tr -d '[:space:]')"
    [[ -n "$_line" ]] && MODELS+=("$_line")
  done < "$_BACKBONE_FILE"
fi
# 목록이 비어 있으면 최소 기본값.
[[ ${#MODELS[@]} -eq 0 ]] && MODELS=("vit_base_patch16_224")
